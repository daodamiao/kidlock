<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="format-detection" content="telephone=no">
<title>儿童限时管控 · 配置</title>
<style>
  :root { --bg:#0f1319; --card:#181d26; --line:#2a3240; --text:#e9eef5; --dim:#93a1b5; --acc:#4da3ff; --ok:#37c26b; --warn:#ff7a5a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%; }
  .wrap { max-width: 900px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:16px; }
  label { display:inline-flex; align-items:center; gap:6px; margin-right:14px; }
  input[type=text], input[type=number], input[type=time], input[type=password], select {
      background:#0f141c; color:var(--text); border:1px solid var(--line);
      border-radius:8px; padding:7px 9px; font-size:14px; }
  input[type=number] { width:100px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:8px 14px;
           font-size:14px; cursor:pointer; }
  button.ghost { background:#263041; }
  button.danger { background:#c9523f; }
  button.small { padding:6px 12px; font-size:13px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:10px 0; }
  .seg { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; }
  .days { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .day { font-size:13px; color:var(--dim); }
  .keys { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:8px 0; }
  .key { background:#263041; border-radius:6px; padding:4px 10px; font-size:13px; }
  .key .x { color:var(--warn); cursor:pointer; margin-left:6px; }
  .pad { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; max-width:520px; }
  .pad button { width:56px; height:48px; font-size:18px; background:#263041; border:1px solid var(--line); }
  .pad button.wide { width:auto; padding:0 16px; font-size:14px; }
  .pad button:active { background:var(--acc); }
  .status { font-size:14px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:13px; }
  .on { background:rgba(255,90,80,.18); color:#ff8a76; }
  .off { background:rgba(55,194,107,.18); color:#5fd79a; }
  #msg { margin-top:10px; font-size:13px; color:var(--dim); min-height:20px; }
  .hint { color:var(--dim); font-size:12.5px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:3px 0; }
  td:first-child { color:var(--dim); width:130px; }

  /* ---------- v1.4.2：卡片标题 / 说明问号浮窗 / 默认折叠 ---------- */
  .ver { color:var(--acc); font-weight:600; }
  .card-head { display:flex; align-items:center; gap:8px; }
  .card.collapsible .card-head { cursor:pointer; user-select:none; }
  .card-head h3 { margin:0; font-size:16px; flex:1; }
  .card-body { margin-top:12px; }
  .card.collapsed .card-body { display:none; }
  .chev { color:var(--dim); font-size:13px; transition:transform .2s; }
  .card.collapsed .chev { transform:rotate(-90deg); }
  .help-btn { display:inline-flex; align-items:center; justify-content:center;
              width:22px; height:22px; flex:0 0 22px; border-radius:50%;
              border:1px solid var(--line); color:var(--dim); font-size:13px;
              font-weight:700; cursor:pointer; line-height:1; }
  .help-btn:hover, .help-btn:active { color:var(--acc); border-color:var(--acc); }
  .remote-btn { display:block; text-align:center; text-decoration:none;
                background:var(--acc); color:#fff; border-radius:10px;
                padding:11px 14px; font-size:15px; font-weight:600; }
  .remote-btn:active { background:#3687e0; }
  .help-mask { position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:100;
               display:flex; align-items:center; justify-content:center; padding:16px; }
  .help-mask[hidden] { display:none; }
  .help-dialog { background:var(--card); border:1px solid var(--line); border-radius:14px;
                 padding:18px; width:100%; max-width:420px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .help-dialog h3 { margin:0 0 10px; font-size:17px; }
  .help-dialog p { margin:0 0 10px; font-size:14px; color:var(--dim); line-height:1.75; }
  .help-dialog p b { color:var(--text); font-weight:600; }
  .help-dialog button { width:100%; margin-top:4px; }

  /* ---------- 密码验证弹窗 ---------- */
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex;
                align-items:center; justify-content:center; z-index:99; padding:16px; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:14px;
           padding:18px; width:100%; max-width:360px; }
  .modal h3 { margin:0 0 12px; font-size:16px; }
  .modal input[type=password] { width:100%; }
  .modal-btns { display:flex; gap:10px; margin-top:12px; }
  .modal-btns button { flex:1 1 0; width:auto; }

  /* ---------- 手机端自适应（宽度 <= 640px） ---------- */
  @media (max-width: 640px) {
    .wrap { padding:14px 12px 48px; }
    h1 { font-size:20px; }
    .sub { font-size:12.5px; }
    .card { padding:14px 12px; margin-bottom:12px; }
    .card h3 { font-size:15.5px; }
    /* 行内控件改为纵向铺满，避免小屏横向溢出 / 挤压 */
    .row { flex-direction:column; align-items:stretch; gap:10px; }
    .row > label { display:flex; flex-direction:column; align-items:stretch; gap:6px; margin-right:0; }
    input[type=text], input[type=number], input[type=time],
    input[type=password], select { width:100%; min-height:44px; font-size:16px; }
    button { width:100%; min-height:44px; font-size:15px; }
    button.small { width:auto; min-height:34px; }
    /* 虚拟按键改为 4 列网格，手指点击更准 */
    .pad { max-width:none; display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
    .pad button { width:100%; height:52px; font-size:17px; }
    .seg { padding:12px 10px; }
    .days { gap:4px; }
    .day { font-size:12.5px; }
    .key { font-size:12.5px; padding:4px 8px; }
    table { font-size:12.5px; }
    td { padding:3px 0; word-break:break-word; }
    td:first-child { width:86px; }
    .modal { max-width:100%; }
    .remote-btn { width:100%; min-height:44px; font-size:15px; }
    .help-dialog { max-width:100%; }
    .card-head h3 { font-size:15.5px; }
    #msg, .hint { font-size:12.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>儿童限时管控</h1>
  <div class="sub">同一局域网的电脑 / 手机即可配置，保存后立即生效（盒子端 App 与锁屏不受网络影响） &nbsp;<span class="ver" id="ver">v1.4.5</span></div>

  <div class="card">
    <div class="card-head"><h3>当前状态</h3><span class="help-btn" data-help="status" title="说明">?</span></div>
    <div class="card-body"><div class="status" id="status">读取中…</div></div>
  </div>

  <div class="card">
    <div class="card-head"><h3>遥控器</h3><span class="help-btn" data-help="remote" title="说明">?</span></div>
    <div class="card-body"><a id="openRemote" class="remote-btn" href="/remote">打开遥控器</a></div>
  </div>

  <div class="card">
    <div class="card-head"><h3>当前画面</h3><span class="help-btn" data-help="shot" title="说明">?</span></div>
    <div class="card-body">
      <div class="row">
        <button class="ghost" id="showShot">查看当前画面截图</button>
        <button class="ghost small" id="refreshShot" style="display:none">刷新</button>
      </div>
      <div id="shotMsg" class="hint" style="margin-top:8px"></div>
      <div id="shotBox" style="display:none;margin-top:10px">
        <img id="shotImg" alt="设备当前画面"
             style="width:100%;border-radius:10px;border:1px solid var(--line);display:block">
        <div class="hint" id="shotTime" style="margin-top:6px"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>基本设置</h3><span class="help-btn" data-help="basic" title="说明">?</span></div>
    <div class="card-body">
      <div class="row">
        <label><input type="checkbox" id="enabled"> 启用管控</label>
        <label>模式
          <select id="mode">
            <option value="OPEN">开放时间段（时段内可看，时段外锁定）</option>
            <option value="BLOCK">禁用时间段（仅时段内锁定）</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <div class="card collapsible collapsed">
    <div class="card-head"><h3>时间段（支持多段 + 按星期重复）</h3><span class="chev">▾</span><span class="help-btn" data-help="segments" title="说明">?</span></div>
    <div class="card-body">
      <div id="segments"></div>
      <button class="ghost" id="addSeg">+ 添加时间段</button>
    </div>
  </div>

  <div class="card collapsible collapsed">
    <div class="card-head"><h3>解锁序列（默认隐藏）</h3><span class="chev">▾</span><span class="help-btn" data-help="keys" title="说明">?</span></div>
    <div class="card-body">
      <div class="seg">
        <div class="row" style="margin:0">
          <b>序列 1 · 电视遥控器</b>
          <span class="hint" id="seq1info"></span>
        </div>
        <div class="keys" id="keys"></div>
      </div>

      <div class="seg">
        <div class="row" style="margin:0">
          <b>序列 2 · 手机音量键</b>
          <span class="hint" id="seq2info"></span>
        </div>
        <div class="keys" id="keys2"></div>
      </div>

      <div class="row">
        <button class="ghost" id="presetKey">恢复默认（遥控器 ↑↑↓↓←←→→ / 手机 音量+音量+音量-音量-）</button>
      </div>

      <div id="editArea" style="display:none">
        <div class="row" style="margin:10px 0 4px">
          录入目标：
          <label><input type="radio" name="seqTarget" value="1" checked> 序列 1（遥控器）</label>
          <label><input type="radio" name="seqTarget" value="2"> 序列 2（手机音量键）</label>
        </div>
        <div class="pad" id="pad"></div>
        <div class="row">
          <button class="ghost" id="delLast">删最后一步</button>
          <button class="ghost" id="clearKey">清空当前序列</button>
        </div>
      </div>

      <div class="row">
        <label>单次解锁时长（分钟）<input type="number" id="singleUnlockMinutes" min="1" max="1440"></label>
      </div>
    </div>
  </div>

  <div class="card collapsible collapsed">
    <div class="card-head"><h3>安全与服务</h3><span class="chev">▾</span><span class="help-btn" data-help="security" title="说明">?</span></div>
    <div class="card-body">
      <div class="row">
        <label>管理密码<input type="text" id="password" placeholder="留空表示不修改"></label>
        <label>Web 端口<input type="number" id="port" min="1024" max="65535" placeholder="默认 9090"></label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="forceStop"> 到点强制停止前台应用</label>
        <label><input type="checkbox" id="lockNow"> 到点同时黑屏锁屏（需设备管理器）</label>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>保存与操作</h3><span class="help-btn" data-help="actions" title="说明">?</span></div>
    <div class="card-body">
      <div class="row">
        <button id="save">保存并立即生效</button>
        <button class="ghost" id="toggleUnlock">立即临时解锁</button>
        <button class="danger" id="lock">立即锁定</button>
        <button class="ghost" id="restartWeb">重启 Web 服务</button>
        <button class="ghost" id="backupNow">立即备份配置</button>
      </div>
      <div id="msg"></div>
    </div>
  </div>
</div>

<div class="help-mask" id="helpMask" hidden>
  <div class="help-dialog">
    <h3 id="helpTitle"></h3>
    <div id="helpText"></div>
    <button id="helpClose">知道了</button>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
var cfg = null;

var keysRevealed = false;   // 是否已输入密码查看序列
var isUnlocked = false;     // 当前是否处于临时解锁状态（由 /api/status 更新）
var isManualLocked = false; // 当前是否处于手动锁定且未临时解锁（由 /api/status 更新）
var pwdCache = '';          // 本次会话最近一次验证成功的密码，用于弹窗预填

/* ---------------- v1.4.2：说明浮窗（标题右侧 ? 点击查看） ---------------- */
var HELP = {
  status: ['当前状态',
    '<p>展示盒子的锁定状态、<b>按星期分组</b>的生效时间段、临时解锁截止时间、下次状态变化、锁屏是否在显示、锁屏前的应用、守护服务 / Web 服务 / 设备管理器 / 配置备份与访问地址。</p>' +
    '<p>该区域每 <b>10 秒</b> 自动刷新，无需手动操作。</p>'],
  remote: ['遥控器（v1.4.2 新增 / 系统服务桥接）',
    '<p>点击「打开遥控器」进入<b>单独的全屏遥控器界面</b>，可远程发送 <b>上 / 下 / 左 / 右 / 确认(OK) / 返回 / 音量− / 音量＋</b> 共 8 个按键，界面左上角可随时<b>返回主界面</b>。</p>' +
    '<p><b>按键如何生效</b>：优先交给盒子自带的<b>系统遥控服务</b>（8080 端口的 <b>/v1/keyevent</b> 接口，与手机端「N1 遥控器」App 用的是同一个），由系统身份执行，所以方向键、OK、返回在第三方应用界面里也能生效。<b>音量键</b>直接调节系统音量，任意界面都生效。</p>' +
    '<p>普通应用没有系统注入权限（<b>INJECT_EVENTS</b>），这是以前返回键失效的根本原因。若盒子上没有 8080 系统服务，会依次回退到 <b>root 身份</b>执行 <b>input keyevent</b>、以及<b>无障碍全局返回</b>（在遥控器页点「去开启」，到电视的<b>设置→无障碍</b>打开「儿童限时管控」）。遥控器页顶部状态条可点「重新检测」确认 8080 服务是否就绪。</p>' +
    '<p>发送成功后状态栏显示实际生效路径，失败会显示每条路径的具体原因。</p>' +
    '<p>发送按键需要管理密码，首次打开时验证一次即可（同一浏览会话内有效，若本页已验证过密码会自动带上）。</p>' +
    '<p>盒子的全屏锁屏页或家长验证页显示时，按键会被它们接收，也可以用来输入解锁序列。</p>'],
  shot: ['当前画面',
    '<p><b>无需密码</b>即可查看盒子当前画面。首次使用会在电视上弹出一次「截屏授权」，用遥控器点「允许」即可，此后可直接查看。</p>' +
    '<p>「查看当前画面截图」获取画面，「刷新」重新截图；授权窗口弹出期间服务会暂缓抢占前台，避免把授权框顶掉。</p>'],
  basic: ['基本设置',
    '<p><b>启用管控</b>：总开关，关闭后所有规则不再生效。</p>' +
    '<p><b>开放时间段</b>：时段内允许观看，时段外锁定；<b>禁用时间段</b>：仅在时段内锁定。</p>' +
    '<p>跨零点时直接把结束时间填得比开始时间小即可（例如 <b>22:00 → 01:00</b>），系统自动按次日处理。</p>'],
  segments: ['时间段',
    '<p>可添加多段时间，每段<b>独立勾选星期</b>（顺序为周日 → 周六）。</p>' +
    '<p>开始与结束填相同时间表示<b>全天</b>；结束时间小于开始时间表示<b>跨零点</b>。</p>' +
    '<p>修改后点击「保存并立即生效」，服务会在 15 秒内应用新规则。</p>'],
  keys: ['解锁序列（两组并行）',
    '<p>支持两组序列：<b>序列 1 电视遥控器方向键</b>、<b>序列 2 手机音量键</b>，任意一组命中即可解锁。</p>' +
    '<p>安全起见打开页面时<b>不显示已配置的序列</b>，点「查看」并输入当前密码后才可见 / 可编辑；用下方虚拟按键依次录入，可删最后一步、清空当前序列或恢复默认。</p>' +
    '<p><b>单次解锁</b>只在本段锁定内有效，到下一个禁用时间点会自动重新锁定；锁屏页与家长验证页都不显示序列，请家长自行牢记。</p>'],
  security: ['安全与服务',
    '<p><b>管理密码</b>：留空表示不修改；打开页面不会回显现有密码。</p>' +
    '<p><b>Web 端口</b>：默认 <b>9090</b>。不能用 <b>6666</b>（Chrome 等浏览器按“不安全端口”直接拒绝连接），也不建议 8080（常与盒子系统服务冲突）；改端口后需用新端口重新访问。</p>' +
    '<p><b>到点强制停止前台应用</b>：锁定前暂停播放、静音并结束正在播放的进程；<b>到点同时黑屏锁屏</b>：需先激活设备管理器。</p>'],
  actions: ['保存与操作',
    '<p>打开页面已自动读取当前配置，<b>无需密码</b>；但「保存并立即生效」「查看序列」及任一操作按钮都会弹出密码验证框。</p>' +
    '<p><b>临时解锁</b>按钮按当前状态在<b>「立即临时解锁 / 清除临时解锁」</b>间切换；<b>立即锁定</b>按钮在手动锁定生效时会自动变成<b>「解除手动锁定」</b>，点一下即可恢复定时规则；另有重启 Web 服务、立即备份配置。</p>' +
    '<p><b>立即锁定</b>会临时压住定时规则，但只到<b>下一个时段翻转点</b>为止，到点自动按规则重新判定。手动锁定生效时，状态面板顶部徽标与「手动锁定」一行都会显示<b>「手动锁定中」</b>及自动恢复时间，不会因一次手动锁定让所有定时规则永久失效。</p>' +
    '<p><b>跨零点时段</b>（如 20:00-次日09:30）表示「生效日 20:00 起、到次日 09:30 止」，<b>生效日当天凌晨不算</b>；页面显示的「下次状态变化」已计入手动锁定到期。</p>' +
    '<p>若要修改管理密码：在「安全与服务」里填写新值并保存（<b>留空表示不修改</b>）。</p>']
};

function showHelp(k){
  var h = HELP[k];
  if(!h) return;
  $('helpTitle').textContent = h[0];
  $('helpText').innerHTML = h[1];
  $('helpMask').hidden = false;
}
function closeHelp(){ $('helpMask').hidden = true; }

var KEY_NAMES = {
  19:'↑ 上', 20:'↓ 下', 21:'← 左', 22:'→ 右', 23:'OK 确认',
  4:'返回', 82:'菜单', 62:'空格',
  24:'音量+', 25:'音量-',
  7:'0', 8:'1', 9:'2', 10:'3', 11:'4',
  12:'5', 13:'6', 14:'7', 15:'8', 16:'9'
};

function pad(v){ return v < 10 ? '0' + v : '' + v; }
function toTime(min){ return pad(Math.floor(min/60)) + ':' + pad(min%60); }
function toMin(str){ var p = (str||'0:0').split(':'); return (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0); }
function fmt(ts){
  if(!ts || ts > 1e17) return '--';
  var d = new Date(ts);
  return pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function api(url, opts){
  return fetch(url, opts).then(function(r){ return r.text(); }).then(function(t){
    try { return JSON.parse(t); } catch(e){ return {ok:false, error:t}; }
  });
}

/* ---------------- 密码验证弹窗（所有写操作统一走这里） ---------------- */
function askPassword(title){
  return new Promise(function(resolve){
    var mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML =
      '<div class="modal">' +
        '<h3>' + esc(title || '请输入管理密码') + '</h3>' +
        '<input type="password" id="__pwd" placeholder="管理密码" autocomplete="current-password">' +
        '<div class="hint" id="__err" style="color:#ff8a76;min-height:18px;margin-top:6px"></div>' +
        '<div class="modal-btns">' +
          '<button class="ghost" id="__cancel">取消</button>' +
          '<button id="__ok">确定</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);

    var inp = mask.querySelector('#__pwd');
    inp.value = pwdCache || '';
    setTimeout(function(){ try { inp.focus(); inp.select(); } catch(e){} }, 50);

    function done(v){
      if (mask.parentNode) document.body.removeChild(mask);
      document.removeEventListener('keydown', onKey);
      resolve(v);
    }
    function onKey(e){ if (e.key === 'Escape') done(null); }
    document.addEventListener('keydown', onKey);

    mask.querySelector('#__cancel').onclick = function(){ done(null); };
    mask.querySelector('#__ok').onclick = function(){
      var v = inp.value.trim();
      if (!v){ mask.querySelector('#__err').textContent = '请输入密码'; return; }
      done(v);
    };
    inp.onkeydown = function(e){
      if (e.key === 'Enter'){ e.preventDefault(); mask.querySelector('#__ok').click(); }
    };
    mask.onclick = function(e){ if (e.target === mask) done(null); };
  });
}

function loadStatus(){
  api('/api/status').then(function(s){
    if(!s.ok){ $('status').textContent = '状态读取失败'; return; }
    if(s.version) $('ver').textContent = 'v' + s.version;
    var locked = s.locked;
    // 按钮状态需在拼状态表格前算好，表格里也要用来显示「手动锁定中」提示
    isUnlocked = !!s.tempUnlocked;
    isManualLocked = !!s.manualLock && !isUnlocked;
    var urls = (s.ips || []).map(function(ip){ return 'http://' + ip + ':' + s.port; }).join('  ');
    // 生效时间段：服务端按星期分组，多组之间用换行分隔，这里转成换行展示
    var segText = (s.segmentsText || '--').split('\n').join('<br>');
    // 前台应用：锁屏中显示「锁屏前的应用」（此时它只是被暂停，仍在后台）
    var fgLabel = s.foregroundPreLock ? '锁屏前应用' : '当前前台应用';
    var fgValue = esc(s.foregroundName || s.foreground || '未知');
    if (s.foreground && s.foregroundName && s.foregroundName !== s.foreground){
      fgValue += ' <span class="hint">(' + esc(s.foreground) + ')</span>';
    }

    $('status').innerHTML =
      '<span class="badge ' + (locked?'on':'off') + '">' + (isManualLocked ? '手动锁定中' : (locked?'已锁定':'未锁定')) + '</span> &nbsp;' +
      '模式：' + (s.mode === 'BLOCK' ? '禁用时间段' : '开放时间段') + '（' + (s.enabled?'已启用':'已停用') + '）<br>' +
      '<table>' +
      '<tr><td>盒子时间</td><td>' + fmt(s.now) + '</td></tr>' +
      '<tr><td>生效时间段</td><td>' + segText + '</td></tr>' +
      '<tr><td>临时解锁到</td><td>' + (s.tempUnlocked && s.unlockUntil ? fmt(s.unlockUntil) : '无') + '</td></tr>' +
      '<tr><td>手动锁定</td><td>' + (isManualLocked ?
        '<b style="color:#c0392b">手动锁定中（定时规则暂不生效）</b>' +
        (s.manualLockUntilText && s.manualLockUntilText !== '--' ? '，' + esc(s.manualLockUntilText) + ' 自动恢复' : '，需手动解除') :
        '无') + '</td></tr>' +
      '<tr><td>下次状态变化</td><td>' + (s.nextTransitionText || fmt(s.nextTransition)) + '</td></tr>' +
      '<tr><td>锁屏是否在显示</td><td>' + (s.lockVisible ? '是' : '否') + '</td></tr>' +
      '<tr><td>' + fgLabel + '</td><td>' + (fgValue || '未知') + '</td></tr>' +
      '<tr><td>守护服务</td><td>' + (s.serviceRunning ? '运行中' : '未运行') + '</td></tr>' +
      '<tr><td>Web 服务</td><td>' + (s.webRunning ? '运行中' : '未运行') + '</td></tr>' +
      '<tr><td>前台识别授权</td><td>' + (s.usageAccess ? '已授权（可精确杀进程）' : '未授权（降级处理）') + '</td></tr>' +
      '<tr><td>设备管理器</td><td>' + (s.deviceAdmin ? '已激活' : '未激活') + '</td></tr>' +
      '<tr><td>配置备份</td><td>' + (s.backup ? esc(s.backup) : '未写入（可在下方点击「立即备份配置」）') + '</td></tr>' +
      '<tr><td>访问地址</td><td>' + (urls || '--') + '</td></tr>' +
      '</table>';

    // 手动锁定按钮本身切换：手动锁定生效时变成「解除手动锁定」
    var lk = $('lock');
    if (isManualLocked) {
      lk.textContent = '解除手动锁定';
      lk.className = 'ghost';
    } else {
      lk.textContent = '立即锁定';
      lk.className = 'danger';
    }
    // 临时解锁按钮两态：立即临时解锁 / 清除临时解锁
    var tu = $('toggleUnlock');
    tu.textContent = isUnlocked ? '清除临时解锁' : '立即临时解锁';
    tu.className = 'ghost';
  });
}

/* ---------------- 当前画面截图（免密码） ---------------- */
var shotUrl = '';
var shotRetry = 0;

function loadShot(){
  $('shotMsg').textContent = '正在获取画面…';
  fetch('/api/screen?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){
      var ct = r.headers.get('Content-Type') || '';
      if (r.ok && ct.indexOf('image/') === 0) return r.blob();
      return r.text().then(function(t){
        var j = null;
        try { j = JSON.parse(t); } catch(e){}
        var err = new Error((j && j.error) || '获取失败');
        err.needConsent = !!(j && j.needConsent);
        throw err;
      });
    })
    .then(function(blob){
      shotRetry = 0;
      var img = $('shotImg');
      if (shotUrl){ try { URL.revokeObjectURL(shotUrl); } catch(e){} }
      shotUrl = URL.createObjectURL(blob);
      img.src = shotUrl;
      $('shotBox').style.display = 'block';
      $('refreshShot').style.display = 'inline-block';
      $('shotMsg').textContent = '';
      var d = new Date();
      $('shotTime').textContent = '获取时间：' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    })
    .catch(function(e){
      $('shotBox').style.display = 'none';
      // 电视端还没点「允许」：自动轮询等待，最多约 30 秒
      if (e && e.needConsent && shotRetry < 15){
        shotRetry++;
        $('shotMsg').textContent = '等待电视端授权…（请在电视上用遥控器点击「允许」）';
        setTimeout(loadShot, 2000);
        return;
      }
      $('shotMsg').textContent = String((e && e.message) || e);
    });
}

function renderSegments(){
  var box = $('segments');
  box.innerHTML = '';
  (cfg.segments || []).forEach(function(s, i){
    var div = document.createElement('div');
    div.className = 'seg';
    var names = ['日','一','二','三','四','五','六'];
    var days = '';
    for (var d = 0; d < 7; d++){
      days += '<label class="day"><input type="checkbox" data-i="' + i + '" data-d="' + d + '"' +
              (s.days[d] ? ' checked' : '') + '> 周' + names[d] + '</label>';
    }
    div.innerHTML =
      '<div class="row">开始 <input type="time" data-i="' + i + '" data-k="start" value="' + toTime(s.start) + '">' +
      '&nbsp;&nbsp;结束 <input type="time" data-i="' + i + '" data-k="end" value="' + toTime(s.end) + '">' +
      '&nbsp;<button class="danger" data-del="' + i + '">删除</button></div>' +
      '<div class="days">' + days + '</div>';
    box.appendChild(div);
  });
  box.querySelectorAll('input[type=time]').forEach(function(el){
    el.onchange = function(){
      cfg.segments[+el.dataset.i][el.dataset.k] = toMin(el.value);
    };
  });
  box.querySelectorAll('input[type=checkbox]').forEach(function(el){
    el.onchange = function(){
      cfg.segments[+el.dataset.i].days[+el.dataset.d] = el.checked;
    };
  });
  box.querySelectorAll('button[data-del]').forEach(function(el){
    el.onclick = function(){
      cfg.segments.splice(+el.dataset.del, 1);
      renderSegments();
    };
  });
}

function renderOneKeys(boxId, arr, seqNo){
  var box = $(boxId);
  box.innerHTML = '';
  if (!keysRevealed){
    // 隐藏态：直接给一个「查看」按钮（点击需输入密码）
    var btn = document.createElement('button');
    btn.className = 'ghost small';
    btn.textContent = '查看';
    btn.onclick = toggleKeys;
    box.appendChild(btn);
    return;
  }
  (arr || []).forEach(function(k, i){
    var s = document.createElement('span');
    s.className = 'key';
    s.innerHTML = (i + 1) + '. ' + esc(KEY_NAMES[k] || ('KeyCode ' + k)) +
                  '<span class="x" data-seq="' + seqNo + '" data-i="' + i + '">✕</span>';
    box.appendChild(s);
  });
  if (!(arr || []).length){
    var e2 = document.createElement('span');
    e2.className = 'key';
    e2.style.color = '#93a1b5';
    e2.textContent = '（空：请至少录入一个按键）';
    box.appendChild(e2);
  }
  // 显示态：提供「隐藏」按钮，可随时手动再次隐藏
  var hb = document.createElement('button');
  hb.className = 'ghost small';
  hb.textContent = '隐藏';
  hb.onclick = hideKeys;
  box.appendChild(hb);

  box.querySelectorAll('.x').forEach(function(el){
    el.onclick = function(){
      var target = (+el.dataset.seq === 2) ? cfg.unlockKeys2 : cfg.unlockKeys;
      target.splice(+el.dataset.i, 1);
      renderKeys();
    };
  });
}

function renderKeys(){
  renderOneKeys('keys', cfg.unlockKeys, 1);
  renderOneKeys('keys2', cfg.unlockKeys2, 2);
  $('seq1info').textContent = keysRevealed
      ? '（共 ' + (cfg.unlockKeys || []).length + ' 步）'
      : '（已配置 ' + (cfg.keyCount1 || 0) + ' 步，已隐藏）';
  $('seq2info').textContent = keysRevealed
      ? '（共 ' + (cfg.unlockKeys2 || []).length + ' 步）'
      : '（已配置 ' + (cfg.keyCount2 || 0) + ' 步，已隐藏）';
  $('editArea').style.display = keysRevealed ? 'block' : 'none';
}

function currentTarget(){
  var els = document.getElementsByName('seqTarget');
  for (var i = 0; i < els.length; i++){ if (els[i].checked) return +els[i].value; }
  return 1;
}

function renderPad(){
  var pad = $('pad');
  pad.innerHTML = '';
  var buttons = [
    [19, '↑'], [20, '↓'], [21, '←'], [22, '→'], [23, 'OK'],
    [24, '音量+'], [25, '音量-'],
    [4, '返回'], [82, '菜单'], [62, '空格'],
    [7,'0'],[8,'1'],[9,'2'],[10,'3'],[11,'4'],[12,'5'],[13,'6'],[14,'7'],[15,'8'],[16,'9']
  ];
  buttons.forEach(function(b){
    var btn = document.createElement('button');
    btn.textContent = b[1];
    btn.title = KEY_NAMES[b[0]] || ('KeyCode ' + b[0]);
    btn.onclick = function(){
      if (!keysRevealed){ msg('请先点击「查看」并输入当前密码', true); return; }
      var target = (currentTarget() === 2) ? cfg.unlockKeys2 : cfg.unlockKeys;
      target.push(b[0]);
      renderKeys();
    };
    pad.appendChild(btn);
  });
}

function collect(){
  var payload = {
    enabled: $('enabled').checked,
    mode: $('mode').value,
    singleUnlockMinutes: parseInt($('singleUnlockMinutes').value, 10) || 30,
    password: $('password').value,
    port: parseInt($('port').value, 10) || 9090,
    forceStop: $('forceStop').checked,
    lockNow: $('lockNow').checked,
    segments: cfg.segments
  };
  // 序列默认隐藏：只有点过「查看」并验证密码后，才把序列一起提交。
  // 否则不提交 unlockKeys / unlockKeys2，服务端会保持原序列不变（防止误覆盖）。
  if (keysRevealed){
    payload.unlockKeys  = (cfg.unlockKeys  || []).slice();
    payload.unlockKeys2 = (cfg.unlockKeys2 || []).slice();
  }
  return payload;
}

function fill(c){
  // 服务端恒定不下发真实序列（只给步数）。若当前处于「已显示」状态，
  // 保留本地已拉取到的序列，避免刷新/保存后被清空。
  var keep1 = keysRevealed ? (cfg && cfg.unlockKeys  ? cfg.unlockKeys.slice()  : null) : null;
  var keep2 = keysRevealed ? (cfg && cfg.unlockKeys2 ? cfg.unlockKeys2.slice() : null) : null;

  cfg = c;
  $('enabled').checked = !!c.enabled;
  $('mode').value = c.mode;
  $('singleUnlockMinutes').value = c.singleUnlockMinutes;
  // 管理密码一律不在页面回显（留空 = 不修改），避免明文暴露
  $('password').value = '';
  $('port').value = c.port;
  $('forceStop').checked = !!c.forceStop;
  $('lockNow').checked = !!c.lockNow;

  cfg.keyCount1 = c.keyCount1 || ((c.unlockKeys  && c.unlockKeys.length)  || 0);
  cfg.keyCount2 = c.keyCount2 || ((c.unlockKeys2 && c.unlockKeys2.length) || 0);
  if (keysRevealed){
    if (!Array.isArray(c.unlockKeys) || !c.unlockKeys.length){
      cfg.unlockKeys = keep1 || [];
    }
    if (!Array.isArray(c.unlockKeys2) || !c.unlockKeys2.length){
      cfg.unlockKeys2 = keep2 || [];
    }
  } else {
    cfg.unlockKeys  = [];
    cfg.unlockKeys2 = [];
  }
  renderSegments();
  renderKeys();
}

/* 「查看 / 隐藏」切换：隐藏态点击需先验证密码 */
function toggleKeys(){
  if (keysRevealed){ hideKeys(); return; }
  askPassword('查看解锁序列').then(function(pwd){
    if (!pwd) return;
    showKeys(pwd);
  });
}

function showKeys(pwd){
  api('/api/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pwd: pwd, action: 'showKeys' })
  }).then(function(r){
    if(!r.ok){
      pwdCache = '';
      msg('查看失败：' + (r.error || '未知错误'), true);
      return;
    }
    pwdCache = pwd;
    cfg.unlockKeys  = (r.unlockKeys  || []).slice();
    cfg.unlockKeys2 = (r.unlockKeys2 || []).slice();
    cfg.keyCount1 = cfg.unlockKeys.length;
    cfg.keyCount2 = cfg.unlockKeys2.length;
    keysRevealed = true;
    renderKeys();
    msg('序列已显示，可修改后点击「保存并立即生效」');
  });
}

/* 「隐藏」：清空本地序列，回到隐藏态（未保存的改动一并丢弃） */
function hideKeys(){
  keysRevealed = false;
  cfg.unlockKeys  = [];
  cfg.unlockKeys2 = [];
  renderKeys();
  msg('序列已隐藏（未保存的改动已丢弃）');
}

function msg(text, warn){
  $('msg').textContent = text;
  $('msg').style.color = warn ? '#ff8a76' : '#93a1b5';
}

function loadConfig(){
  // 打开页面即自动读取，无需密码（密码仅用于写入校验）
  // 注意：两组解锁序列默认不下发，需点击「查看」并验证密码后才展示
  api('/api/config').then(function(r){
    if(!r.ok){ msg('配置读取失败：' + (r.error || '未知错误'), true); return; }
    fill(r.config);
    msg('配置已自动加载；解锁序列已隐藏，如需查看/修改请点击「查看」并输入当前密码');
  });
}

function save(){
  askPassword('保存配置').then(function(pwd){
    if (!pwd) return;
    doSave(pwd);
  });
}

function doSave(pwd){
  var newPw = $('password').value;          // 管理密码框有值 = 要改密码
  var changingPw = !!newPw;
  var payload = collect();
  payload.pwd = pwd;
  api('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function(r){
    if(!r.ok){
      if (String(r.error || '').indexOf('密码') >= 0) pwdCache = '';
      msg('保存失败：' + (r.error || '未知错误'), true);
      return;
    }
    pwdCache = changingPw ? newPw : pwd;   // 密码已变则同步缓存，避免后续操作失败
    fill(r.config);
    msg('已保存并生效' + (changingPw ? '，管理密码已更新' : '（管理密码未修改）')
        + (keysRevealed ? '' : '（解锁序列未改动）'));
    loadStatus();
  });
}

function action(a, label){
  askPassword('执行「' + (label || a) + '」').then(function(pwd){
    if (!pwd) return;
    api('/api/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pwd: pwd, action: a })
    }).then(function(r){
      if(!r.ok){
        if (String(r.error || '').indexOf('密码') >= 0) pwdCache = '';
        msg('操作失败：' + (r.error || '未知错误'), true);
        return;
      }
      pwdCache = pwd;
      msg((label || '操作') + '：成功');
      loadStatus();
    });
  });
}

(function init(){
  // v1.4.2：问号说明浮窗（用 addEventListener，避免覆盖密码弹窗的 Esc 监听）
  document.querySelectorAll('.help-btn').forEach(function(el){
    el.onclick = function(ev){
      if(ev.stopPropagation) ev.stopPropagation();
      showHelp(el.getAttribute('data-help'));
    };
  });
  $('helpClose').onclick = closeHelp;
  $('helpMask').onclick = function(ev){ if(ev.target === $('helpMask')) closeHelp(); };
  document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape') closeHelp(); });

  // v1.4.2：长功能项默认折叠，点击标题展开 / 收起
  document.querySelectorAll('.card.collapsible .card-head').forEach(function(head){
    head.onclick = function(){ head.parentNode.classList.toggle('collapsed'); };
  });

  // v1.4.2：进入遥控器前把已验证的密码交给新页面，免重复输入
  $('openRemote').onclick = function(){
    if(pwdCache){ try { sessionStorage.setItem('kidlock_pwd', pwdCache); } catch(e){} }
  };

  $('addSeg').onclick = function(){
    cfg.segments.push({ start: 18*60, end: 20*60, days: [1,1,1,1,1,1,1] });
    renderSegments();
  };
  $('clearKey').onclick = function(){
    if (currentTarget() === 2){ cfg.unlockKeys2 = []; } else { cfg.unlockKeys = []; }
    renderKeys();
  };
  $('delLast').onclick = function(){
    var t = (currentTarget() === 2) ? cfg.unlockKeys2 : cfg.unlockKeys;
    t.pop();
    renderKeys();
  };
  $('presetKey').onclick = function(){
    if (!keysRevealed){ msg('请先点击「查看」并输入当前密码', true); return; }
    cfg.unlockKeys  = [19,19,20,20,21,21,22,22];
    cfg.unlockKeys2 = [24,24,25,25];
    renderKeys();
    msg('已填入默认序列，点击「保存并立即生效」后生效');
  };
  $('save').onclick = save;
  $('showShot').onclick = function(){ shotRetry = 0; loadShot(); };
  $('refreshShot').onclick = function(){ shotRetry = 0; loadShot(); };
  $('toggleUnlock').onclick = function(){
    if (isUnlocked) action('clearUnlock', '清除临时解锁');
    else action('unlock', '立即临时解锁');
  };
  $('lock').onclick = function(){
    if (isManualLocked) action('clearUnlock', '解除手动锁定');
    else action('lock', '立即锁定');
  };
  $('restartWeb').onclick = function(){ action('restartWeb', '重启 Web 服务'); };
  $('backupNow').onclick = function(){ action('backup', '立即备份配置'); };

  cfg = { enabled:true, mode:'OPEN', segments:[],
          unlockKeys:[], unlockKeys2:[], keyCount1:0, keyCount2:0,
          singleUnlockMinutes:30, password:'', port:9090, forceStop:true, lockNow:false };
  renderSegments();
  renderKeys();
  renderPad();
  loadConfig();          // 打开页面自动读取配置，无需密码（序列默认隐藏）
  loadStatus();
  setInterval(loadStatus, 10000);
})();
</script>
